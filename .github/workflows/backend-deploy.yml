name: Deploy Backend to VPS

on:
  push:
    branches:
      - main  # আপনার মেইন ব্রাঞ্চের নাম master হলে এখানে master লিখবেন

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        env:
          SSH_PASSWORD: ${{ secrets.VPS_PASSWORD }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
        run: |
          # ১. SSH সংযোগের জন্য sshpass ইনস্টল করা (টাইম-আউট এড়াতে)
          sudo apt-get update && sudo apt-get install -y sshpass
          
          # ২. সরাসরি অফিশিয়াল SSH প্রোটোকল ব্যবহার করে সার্ভারে রিকোয়েস্ট পাঠানো
          sshpass -p "$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no -o ConnectTimeout=60 "$VPS_USERNAME"@"$VPS_HOST" << 'EOF'
            cd /root/backend/daygist-server-social
            
            # ৩. গিট থেকে লেটেস্ট কোড নেওয়া
            git fetch --all
            git reset --hard origin/main
            
            # ৪. শুধুমাত্র প্রোডাকশন প্যাকেজগুলো ইনস্টল করা
            npm install --production
            
            # ৫. PM2 দিয়ে ব্যাকএন্ড স্মার্ট রিস্টার্ট করা
            # অলরেডি চলতে থাকলে ডাউনটাইম ছাড়া রিস্টার্ট হবে, না চললে নতুন করে স্টার্ট হবে
            pm2 restart daygist-server-social || pm2 start src/server.js --name "daygist-server-social"
            
            # ৬. PM2 কনফিগারেশন সেভ করা
            pm2 save
          EOF
